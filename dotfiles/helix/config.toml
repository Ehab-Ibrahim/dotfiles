theme = "catppuccin_macchiato"

[editor]
line-number = "relative"
true-color = true
bufferline = "always"
auto-format = false

[editor.inline-diagnostics]
cursor-line = "warning" # show warnings and errors on the cursorline inline

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.whitespace.render]
newline = "all"

[editor.indent-guides]
render = true

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
C-s = ":write"
"*" = [
  # Select full word
  "move_char_right",
  "move_prev_word_start",
  "move_next_word_end",
  # Search selected word (exact)
  "search_selection_detect_word_boundaries",
]
H = "goto_previous_buffer"
L = "goto_next_buffer"
C-q = ":buffer-close"
C-h = "jump_view_left"
C-l = "jump_view_right"
C-j = "jump_view_down"
C-k = "jump_view_up"

[keys.normal.space]
c = { f = ":format" }
