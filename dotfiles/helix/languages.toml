[language-server.verible]
command = "verible-verilog-ls"
# instance-shadowing flags every `import pkg::item;` after the first as shadowing `pkg`
args = ["--ruleset", "all", "--rules=-instance-shadowing"]

# Per-project settings (include dirs, a .f file list) go in .slang/server.json
[language-server.slang-server]
command = "slang-server"

[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[language-server.basedpyright.config]
basedpyright.analysis.typeCheckingMode = "standard"

[[language]]
name = "python"
language-servers = ["ruff", "basedpyright"]

[[language]]
name = "verilog"
language-servers = [
  "slang-server",
  { name = "verible", only-features = ["diagnostics"] }
]
# slang-server doesn't format
formatter = { command = "verible-verilog-format", args = [
  "--wrap_spaces=2",
  "--column_limit=100",
  "--port_declarations_alignment=align",
  "--named_parameter_alignment=align",
  "--named_port_alignment=align",
  "--try_wrap_long_lines",
  "-",
] }

[[language]]
name = "nix"
formatter = { command = "alejandra" }
