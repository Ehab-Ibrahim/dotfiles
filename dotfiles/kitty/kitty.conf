shell fish

# FONT
font_family      JetBrains Mono Nerd Font Mono
font_size 12.0
# Make text a bit bolder on light backgrounds
text_composition_strategy 1.7 0

# Scroll back buffer and pager
scrollback_lines 10000
scrollback_pager nvim -u NONE
\ -c "lua require('kitty_pager')(INPUT_LINE_NUMBER, CURSOR_LINE, CURSOR_COLUMN)" -

# Disable checking updates
update_check_interval 0

hide_window_decorations yes
window_padding_width 3
cursor_shape beam

# Key mappings
map ctrl+shift+enter new_window_with_cwd

# Jumpy cursor trail
cursor_trail 3
cursor_trail_decay 0.02 0.1
