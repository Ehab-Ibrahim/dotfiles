[nvim.files]
"dotfiles/nvim" = "~/.config/nvim/"

[helix.files]
"dotfiles/helix" = "~/.config/helix/"

[shell.files]
"dotfiles/fish" = "~/.config/fish/"
"dotfiles/gtkwaverc" = "~/.gtkwaverc"
"dotfiles/starship.toml" = "~/.config/starship.toml"
"dotfiles/zellij" = "~/.config/zellij/"
"dotfiles/lazygit.yml" = "~/.config/lazygit/config.yml"
"dotfiles/mise/config.toml" = "~/.config/mise/config.toml"

[git.files]
"dotfiles/gitconfig/entry" = "~/.config/git/config"
"dotfiles/gitconfig/config" = "~/.config/git/eibrahim/config"
"dotfiles/gitconfig/allowed_signers" = "~/.config/git/eibrahim/allowed_signers"

[git.variables]
# Set to a directory (without a trailing /) to use this config only in repos under it
git_workdir = ""

[ssh.files]
"dotfiles/ssh/config" = "~/.ssh/config"
"dotfiles/ssh/rc" = "~/.ssh/rc"
